const SETS = ["全部", ...new Set(DATA.map(d=>d.set))];
const pick = s => s === "全部" ? DATA : DATA.filter(d=>d.set===s);
let curSet = SETS[0];
let mode = "normal";
const au = document.getElementById("au");

const tabsEl = document.getElementById("tabs");
SETS.forEach(s=>{
  const n = pick(s).length;
  const b = document.createElement("button");
  b.className = "tab" + (s===curSet?" on":"");
  b.textContent = `${s} (${n})`;
  b.onclick = ()=>{ stop(); curSet=s;
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("on"));
    b.classList.add("on"); render(); };
  tabsEl.appendChild(b);
});

document.querySelectorAll(".mbtn").forEach(btn=>{
  btn.onclick = ()=>{ stop(); mode = btn.dataset.mode;
    document.querySelectorAll(".mbtn").forEach(x=>x.classList.remove("on"));
    btn.classList.add("on"); render(); };
});

function render(){
  const list = document.getElementById("list");
  list.innerHTML = "";
  let lastSet = null;
  pick(curSet).forEach((d,i)=>{
    if(curSet === "全部" && d.set !== lastSet){
      lastSet = d.set;
      const g = document.createElement("div"); g.className = "grp";
      g.textContent = d.set.replace(/^p\.(\d+)\s*/, "p.$1 · ") + "　(" +
        DATA.filter(x=>x.set===d.set).length + " 条)";
      list.appendChild(g);
    }
    const card = document.createElement("div");
    card.className = "card"; card.id = "c"+i;
    const play = document.createElement("button");
    play.className = "pbtn"; play.textContent = "▶";
    play.onclick = ()=>playClip(i, 1, play);
    const slow = document.createElement("button");
    slow.className = "pbtn slow"; slow.textContent = "½";
    slow.title = "半速播放";
    slow.onclick = ()=>playClip(i, 0.6, slow);
    const meta = document.createElement("div"); meta.className = "meta";
    const w = document.createElement("div"); w.className = "w";
    const pgTag = (d.page || "").replace(".", "");
    w.innerHTML = `<span class="idx">${pgTag}·${String(d.i).padStart(2,"0")}</span>${d.word}`;
    const th = document.createElement("div"); th.className = "th"; th.textContent = d.thai || "";
    const cn = document.createElement("div");
    cn.className = "cn" + (mode==="quiz"?" hidden-cn":"");
    cn.innerHTML = `<span class="txt">${d.cn}</span>`;
    const rev = document.createElement("button");
    rev.className = "reveal"; rev.style.display = (mode==="normal"?"none":"inline");
    rev.textContent = "显示";
    rev.onclick = ()=>{ const t = cn.querySelector(".txt");
      const off = t.style.filter !== "blur(6px)" && t.style.filter !== "";
      if(mode==="quiz"){ t.style.filter = off?"blur(6px)":"none"; rev.textContent = off?"显示":"隐藏"; }
    };
    cn.appendChild(rev);
    const dur = document.createElement("div"); dur.className = "dur";
    dur.textContent = d.dur.toFixed(1) + "s";
    meta.appendChild(w); meta.appendChild(th); meta.appendChild(cn);
    card.appendChild(play); card.appendChild(slow);
    card.appendChild(meta); card.appendChild(dur);

    if(mode==="dict"){ // 听写模式：盖住泰文，只留喇叭
      th.style.filter = "blur(7px)"; th.style.userSelect = "none";
      const rw = document.createElement("button");
      rw.className = "reveal"; rw.textContent = "显示泰文";
      rw.onclick = ()=>{ const off = th.style.filter !== "blur(7px)" && th.style.filter !== "";
        th.style.filter = off?"blur(7px)":"none"; rw.textContent = off?"显示泰文":"隐藏"; };
      meta.appendChild(rw);
    }
    list.appendChild(card);
  });
}

let curBtn = null;   // 当前处于播放/暂停状态的按钮
function resetBtn(){
  if(curBtn){ curBtn.textContent = "▶"; curBtn = null; }
  document.querySelectorAll(".card.playing").forEach(c=>c.classList.remove("playing"));
}
function playClip(i, rate=1, btn){
  const d = pick(curSet)[i];
  // 同一条：播放中点一下=暂停；暂停中点一下=从暂停处继续
  if(btn === curBtn && !au.paused){ au.pause(); btn.textContent = "▶"; return; }
  if(btn === curBtn && au.paused && au.currentTime > 0 && !au.ended){
    au.play(); btn.textContent = "⏸"; return;
  }
  resetBtn();
  au.src = d.file;
  au.playbackRate = rate;
  au.play().catch(()=>alert("无法播放：" + d.file));

}
function stop(){
  au.pause(); au.currentTime = 0; resetBtn();
}

document.getElementById("checkbtn").onclick = ()=>{
  const box = document.getElementById("checkout");
  const rows = DATA;
  const bad = rows.filter(d=>d.flag && d.flag!=="OK");
  let txt = `自检 2026-11-04 · 共 ${rows.length} 条\n`;
  txt += `通过 ${rows.length - bad.length} 条 · 疑似问题 ${bad.length} 条\n\n`;
  const leads = rows.map(d=>d.lead_s||0), trails = rows.map(d=>d.trail_s||0);
  txt += `开头静音：min ${Math.min(...leads).toFixed(2)}s / 平均 ${(leads.reduce((a,b)=>a+b,0)/leads.length).toFixed(2)}s\n`;
  txt += `结尾静音：min ${Math.min(...trails).toFixed(2)}s / 平均 ${(trails.reduce((a,b)=>a+b,0)/trails.length).toFixed(2)}s\n`;
  if(bad.length) txt += "\n" + bad.map(d=>`⚠️ ${d.word}: ${d.flag}`).join("\n");
  else txt += "\n✅ 未检出开头/结尾截断（首尾能量均低于主体）";
  box.style.display = "block"; box.textContent = txt;
};
